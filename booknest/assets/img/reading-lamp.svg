<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420">
  <!-- A desk lamp lighting an open book at night. Original illustration for BookNest. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#F0BC5E" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#E5A93D" stop-opacity=".08"/>
      <stop offset="1" stop-color="#E5A93D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" x2="1">
      <stop offset="0" stop-color="#E6DCC8"/>
      <stop offset="1" stop-color="#F4EDE0"/>
    </linearGradient>
  </defs>
  <rect width="520" height="420" rx="24" fill="#171B22"/>
  <!-- window with moon -->
  <rect x="330" y="40" width="140" height="150" rx="8" fill="#0E1116" stroke="#2A3140" stroke-width="4"/>
  <path d="M400 40v150M330 115h140" stroke="#2A3140" stroke-width="4"/>
  <circle cx="440" cy="78" r="16" fill="#F2EEE6" opacity=".9"/>
  <circle cx="446" cy="73" r="14" fill="#0E1116"/>
  <circle cx="360" cy="70" r="1.6" fill="#F2EEE6" opacity=".7"/>
  <circle cx="380" cy="150" r="1.4" fill="#F2EEE6" opacity=".5"/>
  <circle cx="450" cy="160" r="1.8" fill="#F2EEE6" opacity=".6"/>
  <!-- light cone -->
  <path d="M170 128 60 330h300L230 128z" fill="url(#glow)"/>
  <!-- desk -->
  <rect x="30" y="330" width="460" height="16" rx="4" fill="#2A3140"/>
  <rect x="60" y="346" width="14" height="60" fill="#1F2530"/>
  <rect x="446" y="346" width="14" height="60" fill="#1F2530"/>
  <!-- lamp -->
  <rect x="84" y="318" width="70" height="12" rx="6" fill="#3A4356"/>
  <path d="M118 318 150 190" stroke="#3A4356" stroke-width="8" stroke-linecap="round"/>
  <path d="M150 190 196 140" stroke="#3A4356" stroke-width="8" stroke-linecap="round"/>
  <circle cx="150" cy="190" r="8" fill="#A9A398"/>
  <path d="M168 100l62 20-12 22-66-8z" fill="#E5A93D"/>
  <path d="M166 134l52 8" stroke="#F0BC5E" stroke-width="4" stroke-linecap="round"/>
  <!-- open book -->
  <path d="M130 322c40-16 82-18 120-4v-60c-38-14-80-12-120 4z" fill="url(#page)"/>
  <path d="M370 322c-40-16-82-18-120-4v-60c38-14 80-12 120 4z" fill="#F4EDE0"/>
  <path d="M250 258v60" stroke="#C9BCA3" stroke-width="2"/>
  <g stroke="#B8AA8F" stroke-width="3" stroke-linecap="round">
    <path d="M150 280c25-9 50-11 80-5M150 294c25-9 50-11 80-5M150 308c20-7 40-9 60-5"/>
    <path d="M270 275c30-6 55-4 80 5M270 289c30-6 55-4 80 5M270 303c24-5 44-3 62 3"/>
  </g>
  <!-- mug -->
  <rect x="396" y="286" width="40" height="44" rx="6" fill="#3FB6A8"/>
  <path d="M436 296c14 0 14 22 0 22" stroke="#3FB6A8" stroke-width="6" fill="none"/>
  <path d="M408 272c-6-8 6-12 0-20M422 272c-6-8 6-12 0-20" stroke="#A9A398" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>
</svg>
